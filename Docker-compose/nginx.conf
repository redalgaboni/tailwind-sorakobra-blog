events {
    worker_connections 1024;
}

http {
    # ---------- SECURITY: Rate Limiting ----------
    limit_req_zone $binary_remote_addr zone=protecc:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=aggressive:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ---------- SECURITY: Block Scanners ----------
    map $http_user_agent $blocked_scanner {
        default 0;
        "~*(?:nikto|nessus|nmap|sqlmap|gobuster|dirb|wfuzz|burp|acunetix|w3af|zaproxy|arachni|netsparker)" 1;
        "~*(?:masscan|zgrab|httpx|ffuf|feroxbuster)" 1;
    }

    # Block empty or suspicious User-Agent
    map $http_user_agent $empty_ua {
        default 0;
        "" 1;
        "~^$" 1;
        "~*(?:python-requests|curl|wget|Go-http-client)" 1;
    }

    # ---------- SECURITY: Block Bad IPs (optional) ----------
    map $remote_addr $blocked_ip {
        default 0;
        "1.2.3.4" 1;
    }

    # ---------- SECURITY: Hide Server Info ----------
    server_tokens off;

    upstream node_app {
        server web:3000;
    }

    log_format main_with_ip
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    # ---------- CATCH-ALL HTTP BLOCK ----------
    server {
        listen 80;
        server_name _;  # matches any host
        return 444;     # close connection silently
    }

    server {
        listen 80;
        server_name sorakobra.com ;

        # Use custom log format
        access_log /dev/stdout main_with_ip;
        error_log /dev/stderr;

        # ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Enforce HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
    server {

        listen 443 ssl;
        http2 on;
        server_name sorakobra.com;

        # ---------- TLS HARDENING ----------
        ssl_certificate /etc/letsencrypt/live/sorakobra.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sorakobra.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/sorakobra.com/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---------- SECURITY: Apply Protections ----------
        limit_req zone=protecc burst=20 nodelay;
        limit_conn conn_limit 10;

        # Block bad methods
        if ($request_method !~ ^(GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH)$) {
            return 405;
        }

        # Block scanners & bad UAs
        if ($blocked_scanner) { return 444; }
        if ($empty_ua) { return 444; }
         if ($blocked_ip) { return 444; }

        # ---------- SECURITY HEADERS ----------
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ---------- BLOCK SENSITIVE FILES ----------
        location ~* \.(aspx?|jsp|shell|cmd|exec|shell_exec|passthru|cgi|pl|sh|sql|db|bak|backup|old|orig|zip|tar|gz)$ {
            return 444;
        }

        location ~* (?:^|/)(?:\.env|env\.|env\.example|\.git|\.svn|\.hg|\.bzr|_viminfo|\.DS_Store) {
            return 444;
        }

        location ~* (?:^|/)(?:\.ssh|ssh|authorized_keys|id_rsa|id_dsa|\.aws|credentials|config\.|settings\.|web\.config) {
            return 444;
        }

        # ---------- PROXY TO APP ----------
        location / {
            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}