# ---------- SECURITY: Rate Limiting ----------
limit_req_zone $binary_remote_addr zone=protecc:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=aggressive:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ---------- SECURITY: Block Scanners ----------
map $http_user_agent $blocked_scanner {
    default 0;
    "~*(?:nikto|nessus|nmap|sqlmap|gobuster|dirb|wfuzz|burp|acunetix|w3af|zaproxy|arachni|netsparker)" 1;
    "~*(?:masscan|zgrab|httpx|ffuf|feroxbuster)" 1;
}

map $http_user_agent $empty_ua {
    default 0;
    "" 1;
    "~^$" 1;
    "~*(?:python-requests|curl|wget|Go-http-client)" 1;
}

map $remote_addr $blocked_ip {
    default 0;
    "1.2.3.4" 1;
}

upstream node_app {
    server web:3000;
}

log_format main_with_ip
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

# ---------- CATCH-ALL HTTP BLOCK ----------
server {
    listen 80;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name sorakobra.com;

    access_log /dev/stdout main_with_ip;
    error_log /dev/stderr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sorakobra.com;

    ssl_certificate /etc/letsencrypt/live/sorakobra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sorakobra.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/sorakobra.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
}