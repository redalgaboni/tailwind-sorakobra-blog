name: Build and Push Image

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

env:
  IMAGE_NAME: albab/prod/sorakobra-web

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4


    - name: Install CA Certificate
      run: |
        # 1. Create Docker certs directory
        CERT_DIR="/etc/docker/certs.d/${{ secrets.REGISTRY_HOST }}"
        sudo mkdir -p "$CERT_DIR"
        
        # 2. Install certificate
        echo "${{ secrets.REGISTRY_CA_CERT }}" | base64 -d | sudo tee "$CERT_DIR/ca.crt" >/dev/null
        sudo chmod 644 "$CERT_DIR/ca.crt"
        
        # 3. Also install in system trust store
        echo "${{ secrets.REGISTRY_CA_CERT }}" | base64 -d | sudo tee /usr/local/share/ca-certificates/registry-ca.crt >/dev/null
        sudo update-ca-certificates
        
        # 4. Verify installation
        openssl x509 -in "$CERT_DIR/ca.crt" -noout -text | grep -A1 "Subject Alternative Name"
        ls -la "$CERT_DIR"

    - name: Configure Docker
      run: |
        # Restart docker to pick up new certificates
        sudo systemctl restart docker
        
        # Verify docker can see the certificate
        sudo ls -la /etc/docker/certs.d/${{ secrets.REGISTRY_HOST }}/

    - name: Login to Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_HOST }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }} 

    #- name: Debug - Test registry access
    #  run: |
    #    curl -vk https://${{ secrets.REGISTRY_HOST }}/v2/_catalog \
    #      --cacert "$HOME/.docker/certs.d/${{ secrets.REGISTRY_HOST }}/ca.crt" \
    #      -u ${{ secrets.REGISTRY_USERNAME }}:${{ secrets.REGISTRY_PASSWORD }}

    #- name: Login to private Docker registry
    #  run: |
    #    docker login -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }} ${{ secrets.REGISTRY_HOST }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: network=host

    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Docker/prod.Dockerfile
        tags: |
          ${{ secrets.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          ${{ secrets.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:latest
          ${{ secrets.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        push: true
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new
        cache: true