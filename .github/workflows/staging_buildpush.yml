name: Build and Push Image

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

env:
  IMAGE_NAME: albab/prod/sorakobra-web

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install CA Certificate (Full Trust)
      run: |
        # System-wide trust
        echo "${{ secrets.REGISTRY_CA_CERT }}" | base64 -d | sudo tee /usr/local/share/ca-certificates/registry-ca.crt >/dev/null
        sudo update-ca-certificates --fresh
    
        # Docker-specific trust
        CERT_DIR="/etc/docker/certs.d/${{ secrets.REGISTRY_HOST }}"
        sudo mkdir -p "$CERT_DIR"
        echo "${{ secrets.REGISTRY_CA_CERT }}" | base64 -d | sudo tee "$CERT_DIR/ca.crt" >/dev/null
        sudo chmod 644 "$CERT_DIR/ca.crt"
    
    - name: Configure Docker Client
      run: |
        # Force Docker client to use custom CA
        mkdir -p ~/.docker
        echo '{
          "credsStore": "desktop",
          "auths": {},
          "tlscacert": "/etc/docker/certs.d/${{ secrets.REGISTRY_HOST }}/ca.crt"
        }' > ~/.docker/config.json
    
    - name: Login to Registry (Secure)
      run: |
        echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login \
          -u "${{ secrets.REGISTRY_USERNAME }}" \
          --password-stdin \
          ${{ secrets.REGISTRY_HOST }}

    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Docker/prod.Dockerfile
        tags: |
          ${{ secrets.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          ${{ secrets.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:latest
          ${{ secrets.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        push: true