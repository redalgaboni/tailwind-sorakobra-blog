name: Build and Push Image

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

env:
  IMAGE_NAME: albab/prod/sorakobra-web

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install CA Certificate (Full System Trust)
      run: |
        # 1. Create directory structure
        CERT_DIR="/etc/docker/certs.d/${{ secrets.REGISTRY_HOST }}"
        sudo mkdir -p "$CERT_DIR"
        
        # 2. Install certificate in Docker's location
        echo "${{ secrets.REGISTRY_CA_CERT }}" | base64 -d | sudo tee "$CERT_DIR/ca.crt" >/dev/null
        
        # 3. Install in system trust store (Ubuntu-specific)
        echo "${{ secrets.REGISTRY_CA_CERT }}" | base64 -d | sudo tee /usr/local/share/ca-certificates/registry-ca.crt >/dev/null
        sudo update-ca-certificates --fresh
        
        # 4. Verify installations
        openssl x509 -in "$CERT_DIR/ca.crt" -noout -text | grep -A1 "Subject Alternative Name"
        ls -la "$CERT_DIR"
        ls -la /usr/local/share/ca-certificates/

    - name: Configure Docker Daemon
      run: |
        # Configure Docker to use system certs
        echo '{
          "mtu": 1460,
          "experimental": true,
          "features": {
            "buildkit": true
          },
          "tlscacert": "/etc/docker/certs.d/${{ secrets.REGISTRY_HOST }}/ca.crt"
        }' | sudo tee /etc/docker/daemon.json
        
        # Restart docker
        sudo systemctl restart docker
        
        # Verify Docker sees the cert
        sudo docker info | grep -A5 "Insecure Registries"

    - name: Test Certificate Trust
      run: |
        # Test with openssl
        openssl s_client -connect ${{ secrets.REGISTRY_HOST }} -showcerts </dev/null 2>/dev/null | openssl x509 -noout -text | grep -A1 "Subject Alternative Name"
        
        # Test with curl
        curl -v --cacert /etc/docker/certs.d/${{ secrets.REGISTRY_HOST }}/ca.crt https://${{ secrets.REGISTRY_HOST }}/v2/_catalog

    - name: Login to Registry (With Explicit CA)
      run: |
        docker --debug \
          --tlscacert /etc/docker/certs.d/${{ secrets.REGISTRY_HOST }}/ca.crt \
          login ${{ secrets.REGISTRY_HOST }} \
          -u ${{ secrets.REGISTRY_USERNAME }} \
          -p ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Docker/prod.Dockerfile
        tags: |
          ${{ secrets.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          ${{ secrets.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:latest
          ${{ secrets.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        push: true